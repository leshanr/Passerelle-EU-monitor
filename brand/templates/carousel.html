<!doctype html>
<meta charset="utf-8">
<title>Passerelle — carousel builder</title>
<!--
  PASSERELLE — Instagram carousel builder
  ═══════════════════════════════════════════════════════════════════════
  Edit the SLIDES array below, open this file in a browser, and screenshot
  each slide — or run `node export.js` in this folder to write PNGs at
  1080 × 1350 straight into an edition's assets/ folder.

  Slide types:
     hook        big headline + monitoring trace + strapline
     text        label + headline + paragraph
     compare     before / after panels  ("what changed" — use this often)
     stat        one enormous number + explanation
     list        numbered items
     timeline    dated events, the last one highlighted
     cta         timeline-free closing card with the Substack link

  Rules that are not negotiable:
     · one idea per slide — if it needs two visuals it is two slides
     · nothing below 26px
     · every slide keeps the source line and the signal rule
-->
<script>
const EDITION = "07";

const SLIDES = [
  { type: "hook",
    beat: "Tech and online life",
    headline: ["The EU wants to check your age ", "before you open TikTok."],
    strap: "Here's what actually happened — and why every account you have is in scope.",
    source: "European Commission, 21 Aug 2026" },

  { type: "text", label: "What happened",
    headline: "The Commission proposed EU-wide age checks for large platforms.",
    para: "Not a law yet — a proposal. It now goes to Parliament and the Council, which is where it will change.",
    source: "European Commission, 21 Aug 2026" },

  { type: "compare", label: "What changed",
    before: "Platforms tick a box saying they check ages.",
    after:  "Platforms have to prove it — or pay 6% of global turnover.",
    note:   "That is the entire story. Everything else is detail.",
    source: "European Commission, 21 Aug 2026" },

  { type: "text", label: "Why did the EU do this",
    headline: "Four countries were about to write four different laws.",
    para: "One EU rule is easier for the platforms and better for the Commission than four incompatible national ones.",
    source: "European Commission, 21 Aug 2026" },

  { type: "text", label: "Who does it affect",
    headline: "Any platform with more than 45 million EU users.",
    para: "Which is to say: all of them.",
    source: "European Commission, 21 Aug 2026" },

  { type: "stat", label: "Why should you care",
    number: "45m", unit: "users — the threshold that puts a platform in scope",
    para: "Every workable age check means handing a platform an ID document or a face scan. Child protection is the reason. Surveillance infrastructure is the method. That tension is the whole fight.",
    source: "European Commission, 21 Aug 2026" },

  { type: "timeline", label: "What happens next",
    events: [["21 Aug 2026 — done", "Commission publishes the proposal", true],
             ["Q1 2027", "Parliament first reading", false],
             ["Late 2027", "Council position, then trilogue", false]],
    cta: "Five developments, ten minutes, every fortnight.",
    ctaLink: "eumonitor.substack.com",
    source: "Passerelle · edition " + EDITION },
];
</script>

<style>
:root{
  --ink:#0C0D10; --raised:#14161B; --paper:#F2F1ED; --dim:#C6C6C1; --muted:#8A8F98;
  --rule:#22242B; --rule-lit:#363A44; --signal:#4F86FF; --wash:#12203F;
  --disp:"Space Grotesk","Archivo","TeX Gyre Heros Cn",Helvetica,Arial,sans-serif;
  --body:"Inter","TeX Gyre Heros",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#25272c;font-family:var(--body);padding:40px;display:flex;flex-wrap:wrap;gap:40px}
.slide{width:1080px;height:1350px;background:var(--ink);color:var(--paper);padding:80px;
       display:flex;flex-direction:column;justify-content:space-between;flex:none}
.hdr{display:flex;justify-content:space-between}
.hdr span{font-family:var(--mono);font-size:22px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.kicker{font-family:var(--mono);font-size:26px;letter-spacing:.2em;color:var(--signal);
        text-transform:uppercase;margin:52px 0 34px}
.mid{flex:1;display:flex;flex-direction:column;gap:36px}
.mid.centre{justify-content:center}
h1{font-family:var(--disp);font-weight:700;font-size:108px;line-height:.94;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--signal)}
h2{font-family:var(--disp);font-weight:700;font-size:70px;line-height:1.02;letter-spacing:-.03em}
p{font-size:38px;line-height:1.4;color:var(--dim)}
.trace{height:70px;width:100%}
.panel{border:2px solid var(--rule-lit);border-radius:10px;padding:38px 40px}
.panel.after{border-color:var(--signal);background:var(--wash)}
.plab{font-family:var(--mono);font-size:22px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
.panel.after .plab{color:var(--signal)}
.ptxt{font-family:var(--disp);font-weight:700;font-size:56px;line-height:1.04;letter-spacing:-.03em}
.arrow{text-align:center;font-size:54px;color:var(--signal);line-height:.6}
.huge{font-family:var(--disp);font-weight:700;font-size:200px;line-height:.86;letter-spacing:-.045em;color:var(--signal)}
.unit{font-family:var(--mono);font-size:26px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:10px}
.it{display:grid;grid-template-columns:66px 1fr;gap:22px;padding:26px 0;border-bottom:1px solid var(--rule)}
.it:last-child{border-bottom:0}
.num{font-family:var(--disp);font-weight:700;font-size:42px;color:var(--signal);letter-spacing:-.03em}
.tl{position:relative;padding-left:46px}
.tl:before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:3px;background:var(--rule-lit)}
.ev{position:relative;margin-bottom:40px}
.ev:before{content:"";position:absolute;left:-42px;top:9px;width:19px;height:19px;border-radius:50%;
           background:var(--ink);border:3px solid var(--rule-lit)}
.ev.on:before{border-color:var(--signal);background:var(--signal)}
.evd{font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ev.on .evd{color:var(--signal)}
.evt{font-family:var(--disp);font-weight:700;font-size:46px;letter-spacing:-.03em;margin-top:8px}
.cta{border:2px solid var(--signal);border-radius:10px;padding:34px 38px;background:var(--wash)}
.cta .l{font-family:var(--mono);font-size:22px;letter-spacing:.18em;color:var(--signal);text-transform:uppercase}
.cta .m{font-size:36px;margin-top:12px;line-height:1.35}
.src{font-family:var(--mono);font-size:24px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.bar{height:8px;background:var(--signal);margin-top:26px}
</style>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  const chrome = (i, s) => `
    <div><div class="hdr"><span>Passerelle</span><span>${String(i+1).padStart(2,"0")}/${String(SLIDES.length).padStart(2,"0")}</span></div>
    ${s.label ? `<div class="kicker">${esc(s.label)}</div>` : ""}</div>`;
  const foot = s => `<div><div class="src">${esc(s.source || "")}</div><div class="bar"></div></div>`;

  const build = {
    hook: s => `<div class="mid centre">
        <div class="kicker" style="margin:0">${esc(s.beat)}</div>
        <h1>${esc(s.headline[0])}<em>${esc(s.headline[1] || "")}</em></h1>
        <svg class="trace" viewBox="0 0 920 70" preserveAspectRatio="none">
          <path d="M0,55 L300,55 L340,55 L360,10 L380,55 L420,55 L920,55" fill="none"
                stroke="#4F86FF" stroke-width="5" stroke-linejoin="round"/></svg>
        <p>${esc(s.strap)}</p></div>`,
    text: s => `<div class="mid"><h2>${esc(s.headline)}</h2><p>${esc(s.para)}</p></div>`,
    compare: s => `<div class="mid">
        <div class="panel"><div class="plab">Now</div><div class="ptxt">${esc(s.before)}</div></div>
        <div class="arrow">↓</div>
        <div class="panel after"><div class="plab">Proposed</div><div class="ptxt">${esc(s.after)}</div></div>
        ${s.note ? `<p>${esc(s.note)}</p>` : ""}</div>`,
    stat: s => `<div class="mid centre">
        <div><div class="huge">${esc(s.number)}</div><div class="unit">${esc(s.unit)}</div></div>
        <p style="color:var(--paper);font-size:42px">${esc(s.para)}</p></div>`,
    list: s => `<div class="mid">${s.items.map((t,i)=>
        `<div class="it"><div class="num">${String(i+1).padStart(2,"0")}</div><div style="font-size:35px;line-height:1.28">${esc(t)}</div></div>`).join("")}</div>`,
    timeline: s => `<div class="mid" style="justify-content:space-between">
        <div class="tl">${s.events.map(([d,t,on])=>
          `<div class="ev${on?" on":""}"><div class="evd">${esc(d)}</div><div class="evt">${esc(t)}</div></div>`).join("")}</div>
        ${s.cta ? `<div class="cta"><div class="l">The full briefing</div>
          <div class="m">${esc(s.cta)}<br><b style="color:var(--signal);font-weight:400">${esc(s.ctaLink)}</b></div></div>` : ""}</div>`,
  };

  document.body.innerHTML = SLIDES.map((s, i) =>
    `<div class="slide" id="slide-${i+1}">${chrome(i,s)}${(build[s.type]||build.text)(s)}${foot(s)}</div>`
  ).join("");
});
</script>
