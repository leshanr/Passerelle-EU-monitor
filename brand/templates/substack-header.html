<!doctype html><meta charset="utf-8"><title>Passerelle — Substack header</title>
<style>
:root{--ink:#0C0D10;--paper:#F2F1ED;--muted:#8A8F98;--signal:#4F86FF;
  --disp:"Space Grotesk","Archivo","TeX Gyre Heros Cn",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#25272c;padding:40px;display:flex;flex-direction:column;gap:40px;font-family:var(--disp)}
.h{background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.header{width:1200px;height:300px}
.social{width:1200px;height:630px;flex-direction:column;align-items:flex-start;justify-content:center;gap:26px}
.wm{font-weight:700;letter-spacing:-.04em;color:var(--paper);line-height:.95}
.rule{background:var(--signal);margin-top:12px}
.strap{font-family:var(--mono);color:var(--muted);letter-spacing:.22em;text-transform:uppercase}
.cap{font-family:var(--mono);color:#888;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
</style>
<div class="cap">Publication header — export at 1200 × 300</div>
<div class="h header">
  <div><div class="wm" style="font-size:76px">PASSERELLE</div>
    <div class="rule" style="height:7px;width:380px"></div></div>
  <div class="strap" style="font-size:14px;text-align:right;line-height:2">European politics.<br>Actually worth knowing.</div>
</div>
<div class="cap">Social preview — export at 1200 × 630</div>
<div class="h social">
  <div style="padding-left:0"><div class="wm" style="font-size:132px">PASSERELLE</div>
    <div class="rule" style="height:10px;width:660px"></div></div>
  <div class="strap" style="font-size:20px">European politics. Actually worth knowing.</div>
  <div style="font-family:'Inter',Helvetica,Arial,sans-serif;color:#C6C6C1;font-size:24px;line-height:1.5;max-width:820px">
    A fortnightly briefing on what actually happened in Europe. Found by a machine. Written by a person.</div>
</div>
